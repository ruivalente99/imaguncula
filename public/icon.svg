<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bananaGrad" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b45309" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background rounded squircle card -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bgGrad)" stroke="#fde68a" stroke-width="8" filter="url(#shadow)"/>

  <!-- Inner die-cut sticker badge outline -->
  <circle cx="256" cy="256" r="160" fill="#ffffff" stroke="#f59e0b" stroke-width="6" stroke-dasharray="12 8" opacity="0.85"/>

  <!-- Papyrus Emblem Curve -->
  <g transform="translate(120, 120) scale(8.5)">
    <path
      d="M7 16c1.5 5 6.5 8 12 8 4.5 0 7-2.5 7-4.5s-2.5-3.5-6-3.5c-5 0-9.5-3-11-7-1-3-.5-6 0-7 1.2 0 2.2 1.8 2.8 3.5.6 1.8 1.8 3.5 4.2 4.5"
      fill="none"
      stroke="url(#bananaGrad)"
      stroke-width="2.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M8 5c-.6 1.2-1.2 2.5-1.2 3.8"
      stroke="#d97706"
      stroke-width="3.2"
      stroke-linecap="round"
    />
  </g>

  <!-- Micro Star Sparkle -->
  <path d="M370 120 L376 136 L392 142 L376 148 L370 164 L364 148 L348 142 L364 136 Z" fill="#f59e0b"/>
</svg>
