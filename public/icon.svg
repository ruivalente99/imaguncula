<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="bananaGrad" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#b45309" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background rounded squircle card -->
  <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#bgGrad)" stroke="#fde68a" stroke-width="8" filter="url(#shadow)"/>

  <!-- Inner die-cut sticker badge outline -->
  <circle cx="256" cy="256" r="160" fill="#ffffff" stroke="#f59e0b" stroke-width="6" stroke-dasharray="12 8" opacity="0.85"/>

  <!-- Nano Banana Vector Emblem -->
  <g transform="translate(68, 68) scale(11.8)">
    <defs>
      <linearGradient id="iconNanoBananaBody" x1="6" y1="8" x2="26" y2="26" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#fde047" />
        <stop offset="45%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#d97706" />
      </linearGradient>
      <linearGradient id="iconNanoBananaStem" x1="6" y1="5" x2="10" y2="10" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#65a30d" />
        <stop offset="100%" stop-color="#4d7c0f" />
      </linearGradient>
      <filter id="iconNanoShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#b45309" flood-opacity="0.25" />
      </filter>
    </defs>

    <!-- Die-Cut Sticker White Contour -->
    <path
      d="M 9.5 9.5 C 7.5 16, 11 25.5, 22.5 25.5 C 25.5 25.5, 27.5 23.5, 27 20.5 C 20 21.5, 14 16, 9.5 9.5 Z"
      stroke="#ffffff"
      stroke-width="3.2"
      stroke-linejoin="round"
      stroke-linecap="round"
      filter="url(#iconNanoShadow)"
    />

    <!-- Main Nano Banana Body -->
    <path
      d="M 9.5 9.5 C 7.5 16, 11 25.5, 22.5 25.5 C 25.5 25.5, 27.5 23.5, 27 20.5 C 20 21.5, 14 16, 9.5 9.5 Z"
      fill="url(#iconNanoBananaBody)"
    />

    <!-- Facet Line for 3D Volume -->
    <path
      d="M 10 10.5 C 10.5 16.5, 15 22.5, 24.5 22"
      stroke="#b45309"
      stroke-width="1.1"
      stroke-linecap="round"
      opacity="0.55"
    />

    <!-- Gloss Highlight (Nano Sheen) -->
    <path
      d="M 8.8 14 C 9.5 19, 13.5 24, 21 24.5"
      stroke="#ffffff"
      stroke-width="1.3"
      stroke-linecap="round"
      opacity="0.8"
    />

    <!-- Fresh Cut Stem -->
    <path
      d="M 7.2 9 L 8.5 6 L 10.5 7 L 9.5 9.8 Z"
      fill="url(#iconNanoBananaStem)"
      stroke="#3f6212"
      stroke-width="0.5"
      stroke-linejoin="round"
    />

    <!-- Ripe Bottom Tip -->
    <circle cx="26.8" cy="20.8" r="1" fill="#78350f" />

    <!-- Nano Sparkle (Top-Right) -->
    <path
      d="M 24 4.5 L 24.8 6.5 L 27 7.2 L 24.8 8 L 24 10 L 23.2 8 L 21 7.2 L 23.2 6.5 Z"
      fill="#fbbf24"
    />

    <!-- Nano Sparkle (Micro Accent) -->
    <circle cx="29" cy="14" r="0.8" fill="#f59e0b" />
  </g>
</svg>
